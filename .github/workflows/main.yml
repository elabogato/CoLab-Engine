name: Build

on:
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]
  workflow_dispatch:

env:
  APP_VERSION: 4.0.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A stuck step used to run until GitHub killed it after 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifact: linuxBuild
            output: export/release/linux/bin
          - name: Windows
            os: windows-latest
            target: windows
            artifact: windowsBuild
            output: export/release/windows/bin
          - name: macOS
            os: macos-15
            target: mac
            artifact: macBuild
            output: export/release/macos/bin
    # Every run step uses bash (Git Bash on Windows) so the same commands work everywhere.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@v2.1.1
        with:
          haxe-version: 4.3.4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('setup/unix.sh', 'setup/windows.bat') }}

      - name: Install haxelibs
        run: |
          mkdir -p "${{ runner.temp }}/haxelib"
          haxelib setup "${{ runner.temp }}/haxelib"
          haxelib install hxcpp --always

          # Reuse the project's own setup script so the pinned versions never go out of sync,
          # but run only its haxelib lines: the originals end with `pause` (windows.bat), `cd ..`
          # and `mkdir ~/haxelib`, and ask questions, which hangs or breaks a CI run.
          if [ "$RUNNER_OS" = "Windows" ]; then SCRIPT=setup/windows.bat; else SCRIPT=setup/unix.sh; fi
          tr -d '\r' < "$SCRIPT" | grep -E '^haxelib (install|set|git) ' | sed -E '/^haxelib set /! s/$/ --always/' > "$RUNNER_TEMP/haxelibs.sh"
          cat "$RUNNER_TEMP/haxelibs.sh"
          bash -e "$RUNNER_TEMP/haxelibs.sh"
          haxelib list

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: haxelib run lime build ${{ matrix.target }} --app-version="${APP_VERSION}-${{ github.run_id }}" -D officialBuild

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
